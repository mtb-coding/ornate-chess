<!doctype html>
<html lang="en" data-theme="ebony" data-board="marble">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ornate Chess">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="color-scheme" content="dark light">
<title>Ornate Chess</title>
<meta name="description" content="Ornate Chess is a browser chess application with a bot opponent, two-player games, puzzles, analysis and saved games.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="src/styles/main.css">
<link rel="stylesheet" href="src/styles/board.css">
<link rel="stylesheet" href="src/styles/pages.css">
<link rel="stylesheet" href="src/styles/mobile.css">
<script>
  // Apply the saved theme before first paint to avoid a flash of the default theme.
  try { var s = JSON.parse(localStorage.getItem('ornate-chess:settings') || '{}'); if (s.theme) document.documentElement.dataset.theme = s.theme; if (s.boardStyle) document.documentElement.dataset.board = s.boardStyle; } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to the main content</a>
<div class="shell">
  <header class="site-header" id="site-header"></header>
  <main id="main" tabindex="-1"><p class="loading">The application is loading.</p></main>
  <footer class="site-footer" id="site-footer"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p>Ornate Chess requires JavaScript to run.</p></noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
